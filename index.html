<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edukinglish - Ecosystem & Learning Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Nunito', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Fredoka', cursive; }
    .bounce-in { animation: bounceIn .5s ease; }
    @keyframes bounceIn { 0%{transform:scale(.7);opacity:0} 60%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
    .shake { animation: shake .4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .float-slow { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  </style>
  <base target="_blank">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

<!-- ============ VISTA DE ACCESO ============ -->
<div id="view-access" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-indigo-800 to-violet-900">
  <div class="w-full max-w-md">
    <div class="text-center mb-6 bounce-in">
      <div class="text-7xl mb-2 float-slow">🦊</div>
      <h1 class="text-4xl font-bold text-amber-400">Edukinglish</h1>
      <p class="text-indigo-200 mt-1">Plataforma Interactiva Multinivel</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-8">
      <h2 class="text-xl font-bold text-slate-800 mb-4">Inicia tu aventura 🚀</h2>
      
      <label class="block text-sm font-bold text-slate-500 mb-1">Nombre del Alumno</label>
      <input id="inp-name" type="text" maxlength="25" placeholder="¿Cómo te llamas?"
        class="w-full p-3 rounded-xl border-2 border-slate-200 mb-4 font-bold focus:border-indigo-500 focus:outline-none">
      
      <label class="block text-sm font-bold text-slate-500 mb-1">Código de Alumno</label>
      <input id="inp-code" type="text" maxlength="25" placeholder="Ej: EDU-001"
        class="w-full p-3 rounded-xl border-2 border-slate-200 mb-4 font-bold focus:border-indigo-500 focus:outline-none uppercase">

      <label class="block text-sm font-bold text-slate-500 mb-1">Selecciona tu Nivel</label>
      <select id="inp-level" class="w-full p-3 rounded-xl border-2 border-slate-200 mb-4 font-bold focus:border-indigo-500 focus:outline-none bg-white text-slate-700">
        <option value="A1">🦊 Explorers (Nivel A1)</option>
        <option value="A2">🔍 Detectives (Nivel A2)</option>
        <option value="B1">🌟 Leaders & Pathfinders (Nivel B1)</option>
      </select>

      <p id="access-error" class="hidden text-sm font-bold text-rose-600 mb-4 p-3 bg-rose-50 rounded-xl border border-rose-200"></p>

      <button id="btn-login" onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-lg py-4 rounded-2xl shadow-lg transition-all transform hover:scale-105 active:scale-95">
        ¡Empezar Misiones! ✨
      </button>
    </div>
    <p class="text-center text-indigo-300 text-xs mt-4">Edukinglish Learning Ecosystem · 2026</p>
  </div>
</div>

<!-- ============ VISTA PRINCIPAL ============ -->
<div id="view-app" class="hidden min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar -->
  <aside class="w-full md:w-64 bg-indigo-900 text-white p-5 flex-shrink-0">
    <div class="flex items-center gap-3 mb-5">
      <div class="w-10 h-10 bg-amber-400 rounded-xl flex items-center justify-center text-2xl">🦊</div>
      <div>
        <span class="font-heading text-xl tracking-wide text-amber-400 block leading-none">Edukinglish</span>
        <span id="sb-level-badge" class="text-[11px] text-indigo-300 font-bold">Nivel A1</span>
      </div>
    </div>

    <div class="bg-indigo-800/60 rounded-xl p-3 mb-4 text-sm">
      <div class="flex items-center gap-2 font-bold"><span class="text-lg">👋</span><span id="sb-name">...</span></div>
      <div class="flex justify-between mt-2 text-indigo-200 text-xs font-bold">
        <span>🔥 Racha: <span id="sb-streak" class="text-amber-400">1</span> día</span>
        <span>⭐ <span id="sb-pts" class="text-amber-400">0</span> pts</span>
      </div>
    </div>

    <p class="text-xs font-bold text-indigo-300 uppercase tracking-wider mb-2">Módulos de la Misión</p>
    <nav class="space-y-1 overflow-y-auto max-h-[45vh] md:max-h-[calc(100vh-290px)] pr-1" id="module-nav"></nav>
    <button onclick="logout()" class="mt-4 w-full text-left px-3 py-2 text-xs font-bold text-indigo-400 hover:text-white transition-colors">↩ Salir / Cambiar datos</button>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full">

    <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
      <div class="flex items-center justify-between">
        <span id="hdr-level-tag" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full uppercase tracking-wider">Nivel A1</span>
        <span id="hdr-code-tag" class="text-xs font-bold text-slate-400">ID: ---</span>
      </div>
      
      <div class="flex flex-wrap items-end justify-between gap-3 mt-2">
        <div>
          <h1 id="module-title" class="text-2xl md:text-3xl font-bold text-slate-800">Módulo 1</h1>
          <p id="module-subtitle" class="text-slate-500 font-semibold text-sm mt-1"></p>
        </div>
        <div class="flex items-center gap-3">
          <div class="bg-orange-50 border border-orange-200 px-4 py-2 rounded-xl text-center">
            <span class="block text-[10px] font-bold text-orange-600 uppercase">🔥 Racha</span>
            <span id="hdr-streak" class="text-xl font-extrabold text-orange-500">1 día</span>
          </div>
          <div class="bg-amber-50 border border-amber-200 px-4 py-2 rounded-xl text-center">
            <span class="block text-[10px] font-bold text-amber-700 uppercase">⭐ Puntos</span>
            <span id="pts-counter" class="text-xl font-extrabold text-amber-600">0</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Selector de Día/Fase -->
    <div class="grid grid-cols-3 gap-3 mb-6" id="days-selector"></div>

    <!-- Indicador de ejercicios -->
    <div class="flex items-center justify-between bg-white p-4 rounded-xl border border-slate-200 mb-6">
      <span class="text-sm font-bold text-slate-500">Progreso de Ejercicios</span>
      <div class="flex gap-2" id="exercise-dots"></div>
    </div>

    <!-- Tarjeta del Ejercicio -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8" id="exercise-container"></section>
  </main>
</div>

<!-- ============ MODAL CELEBRACIÓN ============ -->
<div id="modal" class="hidden fixed inset-0 bg-slate-900/70 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center bounce-in">
    <div class="text-6xl mb-3" id="modal-emoji">🎉</div>
    <h2 class="text-2xl font-bold text-slate-800 mb-1" id="modal-title">¡Fase Completada!</h2>
    <div class="text-4xl my-3 tracking-widest">⭐⭐⭐</div>
    <p class="text-slate-500 font-semibold mb-6" id="modal-msg"></p>
    <button id="modal-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-lg py-4 rounded-2xl shadow-lg transition-all transform hover:scale-105">
      Continuar ➔
    </button>
  </div>
</div>

<script>
/* ================= CONFIGURACIÓN GOOGLE SHEETS APPS SCRIPT ================= */
// Coloca la URL de tu Web App desplegada en Google Apps Script
const GOOGLE_SHEETS_WEBAPP_URL = "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT";

const levelTitles = {
  "A1": "🦊 Explorers (Nivel A1)",
  "A2": "🔍 Detectives (Nivel A2)",
  "B1": "🌟 Leaders & Pathfinders (Nivel B1)"
};

const moduleTitles = {
  "A1": {"1": "Greetings & Introductions", "2": "Numbers, Age & Colors", "3": "Family & Pets", "4": "School & Objects", "5": "Daily Habits", "6": "Food & Drinks", "7": "Wild Animals & Abilities", "8": "House & Prepositions", "9": "Clothes & Weather", "10": "City & Places"},
  "A2": {"1": "Logic & Mystery Escape", "2": "World Explorers & Countries", "3": "Science & Experiments", "4": "The Money Mission", "5": "Travel & Transportation", "6": "Health & Body", "7": "Jobs & Professions", "8": "Environment & Nature", "9": "Technology & Media", "10": "Culture & Festivals"},
  "B1": {"1": "Storytelling & Pitching", "2": "Future Tech & AI", "3": "Real-World Business", "4": "Personal Finance & Strategy", "5": "Global Citizenship", "6": "Debates & Opinions", "7": "Leadership Skills", "8": "Media Literacy", "9": "Creative Writing", "10": "Career Exploration"}
};

/* ================= BANCO DE EJERCICIOS BASE ================= */
const exercisesData = {
  "A1": {
    "1": {
      "1": [
        {"type": "Multiple Choice", "q": "Select the correct greeting for 8:00 AM", "a": "Good morning", "fb": "Good morning se usa desde temprano hasta el mediodía.", "options": ["Good morning", "Good night", "Goodbye"]},
        {"type": "Listening", "q": "Listen. Escucha y selecciona la respuesta a: What's your name?", "a": "My name is Alex", "fb": "My name is... se usa para decir tu nombre.", "text": "What's your name?", "options": ["My name is Alex", "I am 10 years old", "I'm fine, thank you"]},
        {"type": "Fill in the Blanks", "q": "Complete. Hello, my name ___ Kingly.", "a": "is", "fb": "Usamos 'is' con nombres singulares o He/She/It.", "options": ["is", "am", "are"]},
        {"type": "Sentence Unscramble", "q": "Unscramble. Ordena para decir 'Él es Dogito':", "a": "He is Dogito", "fb": "La estructura es: Sujeto (He) + Verbo (is) + Nombre (Dogito).", "options": ["Dogito | He | is", "He is Dogito", "is He Dogito"]},
        {"type": "Odd One Out", "q": "Odd One Out. Selecciona la palabra que no pertenece al grupo:", "a": "Good night", "fb": "Good night se usa para despedirse antes de dormir.", "options": ["Good morning", "Hello", "Hi", "Good night"]}
      ]
    }
  }
};

const STORAGE_KEY = 'edukinglish_app_v3';
let currentLevel = "A1", currentModule = 1, currentDay = 1, currentExIndex = 0;
let isSolved = false;
let profile = null;

async function login() {
  const name = document.getElementById('inp-name').value.trim();
  const code = document.getElementById('inp-code').value.trim().toUpperCase();
  const level = document.getElementById('inp-level').value;
  const err = document.getElementById('access-error');
  const btn = document.getElementById('btn-login');

  err.classList.add('hidden');

  if (!name || !code) {
    err.textContent = '❌ Por favor ingresa tu nombre y código de alumno.';
    err.classList.remove('hidden');
    return;
  }

  btn.innerText = "Verificando en Google Sheets... ⏳";
  btn.disabled = true;

  try {
    let isValid = true;
    if (GOOGLE_SHEETS_WEBAPP_URL && !GOOGLE_SHEETS_WEBAPP_URL.includes("PEGA_AQUI")) {
      const res = await fetch(`${GOOGLE_SHEETS_WEBAPP_URL}?code=${code}`);
      const data = await res.json();
      if (data.status === "INACTIVE" || data.status === "PENDING") {
        isValid = false;
      }
    }

    btn.innerText = "¡Empezar Misiones! ✨";
    btn.disabled = false;

    if (isValid) {
      currentLevel = level;
      profile = { name, code, level, pts: 0, streak: 1 };
      saveProfile();
      enterApp();
    } else {
      err.innerHTML = `⚠️ Tu suscripción no está activa.<br><a href="https://wa.me/522220000000?text=Hola,%20quiero%20renovar%20mi%20suscripcion%20codigo%20${code}" target="_blank" class="underline font-bold text-indigo-700">Contactar Soporte por WhatsApp 📲</a>`;
      err.classList.remove('hidden');
    }
  } catch(e) {
    btn.innerText = "¡Empezar Misiones! ✨";
    btn.disabled = false;
    currentLevel = level;
    profile = { name, code, level, pts: 0, streak: 1 };
    enterApp();
  }
}

function sendProgressToSheets() {
  if (!GOOGLE_SHEETS_WEBAPP_URL || GOOGLE_SHEETS_WEBAPP_URL.includes("PEGA_AQUI")) return;
  fetch(GOOGLE_SHEETS_WEBAPP_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      code: profile.code,
      name: profile.name,
      level: currentLevel,
      module: currentModule,
      day: currentDay,
      pts: profile.pts
    })
  }).catch(e => console.log(e));
}

function saveProfile() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
  sendProgressToSheets();
}

function enterApp() {
  document.getElementById('view-access').classList.add('hidden');
  document.getElementById('view-app').classList.remove('hidden');
  document.getElementById('sb-name').textContent = profile.name;
  document.getElementById('sb-level-badge').textContent = levelTitles[currentLevel] || currentLevel;
  document.getElementById('hdr-level-tag').textContent = levelTitles[currentLevel] || currentLevel;
  document.getElementById('hdr-code-tag').textContent = `ID: ${profile.code}`;
  renderNav();
  updateUI();
}

function logout() {
  document.getElementById('view-app').classList.add('hidden');
  document.getElementById('view-access').classList.remove('hidden');
}

function renderNav() {
  const nav = document.getElementById('module-nav');
  nav.innerHTML = '';
  const titles = moduleTitles[currentLevel] || {};

  for (let i = 1; i <= 10; i++) {
    const btn = document.createElement('button');
    btn.className = `w-full text-left px-3 py-2.5 rounded-xl font-bold transition-all flex items-center justify-between text-xs mb-1 ${
      i === currentModule ? 'bg-indigo-700 text-amber-400' : 'hover:bg-indigo-800 text-indigo-100'
    }`;
    btn.innerHTML = `<span class="truncate">📘 M${i}: ${titles[i] || 'Módulo ' + i}</span>`;
    btn.onclick = () => { currentModule = i; currentDay = 1; currentExIndex = 0; updateUI(); };
    nav.appendChild(btn);
  }
}

function updateUI() {
  document.getElementById('module-title').innerText = `Módulo ${currentModule}`;
  document.getElementById('module-subtitle').innerText = (moduleTitles[currentLevel] || {})[currentModule] || '';
  document.getElementById('pts-counter').textContent = profile.pts;
  document.getElementById('sb-pts').textContent = profile.pts;

  const ds = document.getElementById('days-selector');
  ds.innerHTML = '';
  for (let d = 1; d <= 3; d++) {
    const b = document.createElement('button');
    b.className = `p-3 rounded-xl border-2 font-bold text-center transition-all ${
      d === currentDay ? 'bg-indigo-600 border-indigo-600 text-white shadow-md' : 'bg-white border-slate-200 text-slate-600 hover:border-indigo-300'
    }`;
    b.innerHTML = `<span class="block text-[10px] uppercase opacity-80">Fase ${d}</span>Día ${d}`;
    b.onclick = () => { currentDay = d; currentExIndex = 0; updateUI(); };
    ds.appendChild(b);
  }

  const dots = document.getElementById('exercise-dots');
  dots.innerHTML = '';
  for (let idx = 0; idx < 5; idx++) {
    const dot = document.createElement('button');
    dot.className = `w-8 h-8 rounded-lg font-bold text-xs transition-all ${
      idx === currentExIndex ? 'bg-indigo-600 text-white scale-110 shadow-sm' : 'bg-slate-100 text-slate-500'
    }`;
    dot.innerText = idx + 1;
    dots.appendChild(dot);
  }

  renderExercise();
}

function playAudio(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }
}

function renderExercise() {
  const container = document.getElementById('exercise-container');
  const levelData = exercisesData[currentLevel] || exercisesData["A1"];
  const moduleData = levelData[currentModule] || levelData["1"];
  const dayData = moduleData[currentDay] || moduleData["1"];
  const ex = dayData[currentExIndex] || dayData[0];

  isSolved = false;

  let html = `<div class="mb-4 flex items-center justify-between">
      <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-3 py-1 rounded-md">${ex.type}</span>
      <span class="text-xs font-bold text-slate-400">Ejercicio ${currentExIndex + 1} de 5</span>
    </div>
    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-6">${ex.q}</h3>`;

  if (ex.type === 'Listening') {
    html += `<div class="mb-6 flex justify-center">
        <button onclick="playAudio('${ex.text || ex.q}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 shadow-md">
          🔊 Escuchar Audio
        </button></div>`;
  }

  if (ex.options) {
    html += `<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">`;
    ex.options.forEach((opt) => {
      html += `<button onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', '${ex.a.replace(/'/g, "\\'")}', '${ex.fb.replace(/'/g, "\\'")}', this)" class="opt-btn p-4 rounded-xl border-2 border-slate-200 font-bold text-slate-700 hover:border-indigo-400 hover:bg-indigo-50 transition-all text-left">${opt}</button>`;
    });
    html += `</div>`;
  }

  html += `<div id="feedback" class="mt-6 hidden p-4 rounded-xl font-bold"></div>
    <div id="next-btn-container" class="mt-6 hidden text-right">
      <button onclick="nextExercise()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-lg px-8 py-4 rounded-2xl shadow-lg">
        Siguiente Ejercicio ➔
      </button>
    </div>`;

  container.innerHTML = html;
}

function checkAnswer(userAns, correctAns, feedbackText, btn) {
  if (isSolved) return;
  const feedback = document.getElementById('feedback');

  if (userAns === correctAns) {
    isSolved = true;
    profile.pts += 10;
    saveProfile();
    document.getElementById('pts-counter').textContent = profile.pts;
    btn.className = "opt-btn p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-800 font-bold text-left";
    feedback.className = "mt-6 p-4 rounded-xl font-bold bg-emerald-100 text-emerald-800";
    feedback.innerHTML = `🎉 <strong>¡Correcto!</strong><br><span class="text-sm font-normal">${feedbackText}</span>`;
    document.getElementById('next-btn-container').classList.remove('hidden');
  } else {
    btn.className = "opt-btn p-4 rounded-xl border-2 border-rose-400 bg-rose-50 text-rose-800 font-bold text-left shake";
    feedback.className = "mt-6 p-4 rounded-xl font-bold bg-rose-100 text-rose-800";
    feedback.innerHTML = `❌ <strong>Inténtalo de nuevo.</strong> ¡Tú puedes! 💪`;
    feedback.classList.remove('hidden');
  }
}

function nextExercise() {
  if (currentExIndex < 4) {
    currentExIndex++;
    updateUI();
  } else {
    showModal();
  }
}

function showModal() {
  document.getElementById('modal-title').textContent = `¡Fase ${currentDay} Completada!`;
  document.getElementById('modal-msg').textContent = `Sumaste 50 puntos a tu cuenta de Edukinglish.`;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal-btn').onclick = () => {
    document.getElementById('modal').classList.add('hidden');
    currentExIndex = 0;
    if (currentDay < 3) currentDay++;
    else { currentDay = 1; if (currentModule < 10) currentModule++; }
    updateUI();
  };
}
</script>
</body>
</html>
